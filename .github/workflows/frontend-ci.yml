name: Frontend CI

on:
  push:
    branches:
      - main
      - "frontend/**"
      - "frontend-*"
      - "qa-automation/**"
      - "qa-automation-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-tests:
    name: React tests and build
    runs-on: ubuntu-latest

    env:
      REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || vars.REACT_APP_API_URL || 'http://localhost:4000' }}
      REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL || vars.REACT_APP_API_BASE_URL || 'http://localhost:4000' }}
      REACT_APP_SCRIPTURE_API_KEY: ${{ secrets.REACT_APP_SCRIPTURE_API_KEY || vars.REACT_APP_SCRIPTURE_API_KEY || 'ci-placeholder' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run React test suite
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        run: npm run build
